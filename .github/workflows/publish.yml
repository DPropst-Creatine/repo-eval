# Publishes to PyPI via trusted publishing (no API tokens).
# Setup (one-time, on pypi.org): the pending trusted publisher for this repo
# must match these claims exactly (all case-sensitive):
#   owner DPropst-Creatine, repo repo-eval, workflow publish.yml,
#   environment pypi
# The GitHub "pypi" environment should require reviewer approval, so a tag
# push alone cannot publish without a human approving the run.
# Release: git tag v0.1.0 && git push origin v0.1.0
# (the tag must equal the version in pyproject.toml; the workflow checks)
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run unit tests (stdlib only, no network)
        run: python3 -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*\"\(.*\)\".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Build
        run: |
          pip install build==1.6.1
          python -m build
      - name: Publish to PyPI
        # Deliberately @release/v1: the reference PyPA itself prescribes for
        # this action; it is the one floating ref kept on purpose.
        uses: pypa/gh-action-pypi-publish@release/v1
