[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-eval"
version = "0.1.0"
description = "Deterministic GitHub repository health check — checkable facts, no AI, no cloning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "DPropst-Creatine" }]
keywords = ["github", "repository", "health-check", "code-review", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-eval = "repo_eval:main"

[project.urls]
Homepage = "https://github.com/DPropst-Creatine/repo-eval"
Repository = "https://github.com/DPropst-Creatine/repo-eval"
Issues = "https://github.com/DPropst-Creatine/repo-eval/issues"

[tool.setuptools]
py-modules = ["repo_eval"]
